{% extends 'events/base.html' %}

{% block content %}

<h2>All Events</h2>

{% for event in events %}

<div class="card mt-3">
<div class="card-body">

<h4>{{event.title}}</h4>

<p>{{event.description}}</p>

<p><b>Date:</b> {{event.date}}</p>
<p><b>Location:</b> {{event.location}}</p>

</div>
</div>

{% endfor %}

{% endblock %}
