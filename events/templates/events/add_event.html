{% extends 'events/base.html' %}

{% block content %}

<h2>Add Event</h2>

<form method="post">

{% csrf_token %}

<input class="form-control mt-2" name="title" placeholder="Event Title">

<textarea class="form-control mt-2" name="description" placeholder="Description"></textarea>

<input class="form-control mt-2" type="date" name="date">

<input class="form-control mt-2" name="location" placeholder="Location">

<button class="btn btn-success mt-3">Add Event</button>

</form>

{% endblock %}
